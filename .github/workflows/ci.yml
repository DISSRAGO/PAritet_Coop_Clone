name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest -v

  cogitor-ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontends/cogitor-ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontends/cogitor-ui
        run: npm ci
      
      - name: Run frontend tests
        working-directory: frontends/cogitor-ui
        run: npm test -- --watch=false --passWithNoTests

  deploy-dev:
    needs: [ backend-tests, cogitor-ui-tests ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Debug SSH key fingerprint
        run: |
          echo "${{ secrets.SSH_KEY }}" > key
          chmod 600 key
          ssh-keygen -lf key

      - name: Deploy dev via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /srv/clone
            git fetch origin main
            git reset --hard origin/main
            bash infra/scripts/start_cogiteka_hybrid.sh
            git reset --hard origin/main
            bash infra/scripts/start_cogiteka_hybrid.sh
